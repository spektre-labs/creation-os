#
# Optional TestPyPI → PyPI chain (manual only). Does not run on GitHub Releases;
# release publishing uses `.github/workflows/publish.yml` (environment `pypi`).
#
# Trusted Publishing (OIDC): configure TestPyPI with repository spektre-labs/creation-os,
# workflow pypi.yml, environment testpypi. For production PyPI from this workflow,
# environment `release` (only used when you run this workflow by hand).
#
name: Publish to PyPI (manual TestPyPI chain)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install from wheel
        run: pip install dist/*.whl
      - name: Smoke test
        run: |
          cos version
          cos gate --prompt "What is 2+2?" --response "4" | tee /tmp/gate.txt
          grep -q ACCEPT /tmp/gate.txt

  publish-testpypi:
    name: Publish to TestPyPI
    needs: test
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
