# Primary CI: fast smoke + Python matrix (no Ollama; no model download).
# Merge gate: `.github/workflows/merge-gate.yml`. Heavy stack / formal / ASan: `ci-stack.yml`.
name: Creation OS CI

concurrency:
  group: creation-os-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Install C build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev libcurl4-openssl-dev

      - name: Build cos + cos-demo
        run: |
          make cos cos-demo
          echo "BUILD OK"

      - name: cos demo --batch
        run: |
          ./cos demo --batch
          echo "DEMO OK"

      - name: cos help
        run: |
          ./cos help
          echo "HELP OK"

      - name: make check-agi
        run: |
          make check-agi
          echo "AGI CHECKS OK"

      - name: make check-inference-cache
        run: make check-inference-cache

      - name: make check-speculative-sigma
        run: make check-speculative-sigma

      - name: make check-omega
        run: make check-omega

      - name: make check-energy-accounting
        run: make check-energy-accounting

      - name: make check-green-score
        run: make check-green-score

  cyclonedx-sbom:
    name: CycloneDX Python SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cyclonedx + editable package (base deps are empty)
        run: |
          python -m pip install -q -U pip cyclonedx-bom
          python -m pip install -q -e .
      - name: Generate sbom.json (environment + pyproject)
        run: |
          cyclonedx-py environment --pyproject pyproject.toml --of JSON -o sbom.json "$(which python)"
      - name: Generate sbom/creation-os.cdx.json (reproducible + dev extra)
        run: bash scripts/sbom/generate_creation_os_cdx.sh
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom/
            sbom.json

  ubuntu-python-dev-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install C build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev libcurl4-openssl-dev
      - name: Install package (dev extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check python/cos/
      - name: Pytest (full tests/)
        run: pytest tests/ -v --tb=short

      - name: Property-based σ-gate (Hypothesis, reproducible seed)
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: pytest tests/test_sigma_properties.py -v --tb=short --hypothesis-seed=42

      - name: Coverage (σ-core, branch, fail under 70%)
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: >
          pytest tests/
          --cov=cos.sigma_gate --cov=cos.config --cov=cos.exceptions
          --cov=cos.decorators --cov=cos.pipeline --cov=cos.sigma_theory
          --cov=cos.structured --cov=cos.watchdog --cov=cos.integrations.decorator
          --cov-branch --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: make check
        run: make check

  python-package-matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (editable + all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest || pip install -e . pytest
      - name: PyPI / packaging acceptance tests
        run: >
          python -m pytest tests/test_gate.py tests/test_cli.py
            tests/test_integrations.py tests/test_e2e.py tests/test_pipeline.py tests/test_probe.py
            tests/test_stream.py tests/test_snapshot.py tests/test_calibrate.py -v --tb=short
      - name: Smoke CLI (score)
        run: |
          cos version
          cos score --prompt "What is 2+2?" --response "4"
      - name: Clean install smoke test
        run: |
          pip install .
          python -c "from cos import SigmaGate; g = SigmaGate(); s,v = g.score('test','ok'); print(f'σ={s:.3f} {v}'); assert v in ('ACCEPT','RETHINK','ABSTAIN')"

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: SPDX headers present (python/cos)
        run: |
          python3 <<'PY'
          import pathlib
          import sys
          root = pathlib.Path("python/cos")
          bad = [
              str(p)
              for p in root.rglob("*.py")
              if "SPDX-License-Identifier" not in p.read_text(encoding="utf-8", errors="replace")
          ]
          if bad:
              print("Missing SPDX-License-Identifier in:\n" + "\n".join(bad[:50]))
              if len(bad) > 50:
                  print(f"... and {len(bad) - 50} more")
              sys.exit(1)
          print(f"SPDX OK ({sum(1 for _ in root.rglob('*.py'))} files)")
          PY
      - name: No alternate SPDX identifiers in python/cos
        run: |
          set -e
          if grep -rE 'SPDX-License-Identifier:.*(MIT|Apache|CC-BY|BSD)' python/cos --include='*.py'; then
            echo "Unexpected SPDX variant in python/cos/"
            exit 1
          fi
          echo "SPDX variant check OK"
      - name: Kernel sigma_gate.h fingerprint (v49)
        run: |
          set -e
          exp=$(tr -d ' \n\r' < docs/dev/sigma_gate_h_v49.sha256)
          act=$(sha256sum src/v49/sigma_gate.h | awk '{print $1}')
          echo "expected=$exp actual=$act"
          test "$exp" = "$act"
      - name: σ primitive header present
        shell: bash
        run: |
          test -f python/cos/sigma_gate.h && echo "python/cos/sigma_gate.h OK"

  pip-core-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel story (no heavy extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: pytest (core gate + integrations + CLI + e2e)
        run: >
          python -m pytest tests/test_gate.py tests/test_cli.py
            tests/test_integrations.py tests/test_e2e.py tests/test_pipeline.py tests/test_probe.py
            tests/test_stream.py tests/test_snapshot.py tests/test_calibrate.py -v --tb=short
      - name: Import + CLI
        run: |
          python -c "from cos import SigmaGate; print(SigmaGate().score('x','y'))"
          cos version
          cos score --prompt "What is 2+2?" --response "4"
          cos gate --prompt "What is 2+2?" --response "4"
