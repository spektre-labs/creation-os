name: Merge Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: creation-os-merge-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install C build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev libcurl4-openssl-dev

      - name: Install Python package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Merge gate
        run: make merge-gate
