#
# Build and push the minimal FastAPI image (Dockerfile.fastapi-serve) to GHCR.
# Tags avoid clashing with Dockerfile.prod: ``<git-tag>-fastapi`` and ``fastapi-latest``.

name: Docker FastAPI σ-serve

on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE_BASE: ghcr.io/spektre-labs/creation-os

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fastapi-serve
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ github.ref_name }}-fastapi
            ${{ env.IMAGE_BASE }}:fastapi-latest
