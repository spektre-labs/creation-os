# Lightweight Python checks (full merge-gate remains local `make merge-gate`).
name: σ-CI (Python lab)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Zero-dep σ-gate tests (importable wheel story)
        run: |
          PYTHONPATH=python python3 -m pytest tests/test_gate.py tests/test_probes.py tests/test_discrimination.py tests/test_hash_embedding.py tests/test_health.py tests/test_agi_demo.py tests/test_edge.py tests/test_cli.py \
            tests/test_integrations.py tests/test_e2e.py tests/test_pipeline.py tests/test_probe.py \
            tests/test_stream.py \
            tests/test_snapshot.py \
            tests/test_calibrate.py -q --tb=short

      - name: v183–v186 lab tests
        run: |
          PYTHONPATH=python python3 -m pytest \
            tests/test_v183_v186_lab.py \
            tests/test_sigma_mcp_v2_lab.py \
            -q --tb=short

      - name: σ-gate smoke (Twin lab gate)
        run: |
          PYTHONPATH=python python3 -c "
          from cos.sigma_twin import TwinGateLab
          g = TwinGateLab()
          s, v = g.score('What is 2+2?', '4')
          print('sigma', s, 'verdict', v)
          "

      - name: cos CLI (gate + version)
        run: |
          PYTHONPATH=python python3 -m cos version
          PYTHONPATH=python python3 -m cos score --prompt "What is 2+2?" --response "4"
          PYTHONPATH=python python3 -m cos gate --prompt "What is 2+2?" --response "4"

      - name: SPDX header spot-check (python/cos)
        run: |
          n=$(grep -r "SPDX-License-Identifier" python/cos --include='*.py' 2>/dev/null | wc -l)
          echo "SPDX-tagged python lines: $n"
          test "$n" -ge 30
