# Trusted Publishing (OIDC): PyPI → project → Publishing → trusted publisher:
# owner spektre-labs, repo creation-os, workflow publish.yml, environment pypi.
#
# NOTE: pushes to main may also run `.github/workflows/pypi-semantic-release.yml`, which uploads
# the same version via Trusted Publishing. For a manual release-only upload path, keep this file
# and adjust triggers or disable one workflow to avoid duplicate "file already exists" errors.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install --upgrade pip build
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
