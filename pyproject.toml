#
# Canonical sdist/wheel for the `cos` Python package (`python/cos/`).
# The separate OpenAI-compat SDK lives under `sdk/python/` (see that tree's pyproject).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creation-os"
version = "3.4.2"
description = "σ-gate cognitive architecture — hallucination detection for any LLM"
readme = "README.md"
license = "LicenseRef-SCSL-1.0 OR AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{ name = "Lauri Elias Rainio", email = "lauri@spektrelabs.com" }]
keywords = [
  "hallucination",
  "hallucination-detection",
  "sigma-gate",
  "sigma",
  "llm",
  "safety",
  "coherence",
  "cognitive-architecture",
  "detection",
  "runtime",
  "ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: Other/Proprietary License",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C",
  "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
# Minimal developer install (`pip install -e ".[dev]"`). Optional-matrix tests also use
# `chat`, `mcp`, `serve`, etc. as needed (many tests use importorskip).
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "numpy>=1.24",
  "ruff>=0.4",
]

chat = ["openai>=1.30"]
openai = ["openai>=1.30"]
mcp = ["mcp>=1.27"]

probes = [
  "numpy>=1.24",
  "torch>=2.0",
  "transformers>=4.40",
  "scikit-learn>=1.4",
]

serve = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "websockets>=12.0",
]

langchain = ["langchain-core>=0.2"]

voice = [
  "faster-whisper>=1.0.0",
  "kokoro>=0.9",
  "soundfile>=0.12.0",
  "sounddevice>=0.4.6",
]

ui = ["nicegui>=2.0", "pywebview>=5.0"]

ingest = ["pymupdf>=1.24", "python-docx>=1.1"]

api = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

litellm = ["litellm>=1.40"]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.55"]
autogen = ["autogen-agentchat>=0.4"]

frameworks = [
  "langchain-core>=0.2",
  "openai>=1.30",
  "litellm>=1.40",
  "langgraph>=0.2",
  "crewai>=0.55",
  "autogen-agentchat>=0.4",
]

viz = ["networkx>=3.2", "matplotlib>=3.8"]
health = ["psutil>=5.9"]
eval = ["scikit-learn>=1.4", "pandas"]

# Explicit union (no `creation-os[...]` self-reference) so `pip install "creation-os[all]"`
# works from sdist/wheel under PEP 508.
all = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "numpy>=1.24",
  "ruff>=0.4",
  "openai>=1.30",
  "mcp>=1.27",
  "torch>=2.0",
  "transformers>=4.40",
  "scikit-learn>=1.4",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "websockets>=12.0",
  "langchain-core>=0.2",
  "faster-whisper>=1.0.0",
  "kokoro>=0.9",
  "soundfile>=0.12.0",
  "sounddevice>=0.4.6",
  "nicegui>=2.0",
  "pywebview>=5.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "litellm>=1.40",
  "langgraph>=0.2",
  "crewai>=0.55",
  "autogen-agentchat>=0.4",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "psutil>=5.9",
  "pandas",
]

[project.scripts]
cos = "cos.__main__:main"

[project.urls]
Homepage = "https://github.com/spektre-labs/creation-os"
Documentation = "https://github.com/spektre-labs/creation-os/tree/main/docs"
Repository = "https://github.com/spektre-labs/creation-os"
Issues = "https://github.com/spektre-labs/creation-os/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/cos"]

[tool.hatch.build.targets.sdist]
include = [
  "/python/cos",
  "/examples",
  "/CHANGELOG.md",
  "/README.md",
  "/LICENSE",
  "/LICENSE-AGPL-3.0.txt",
  "/LICENSE-SCSL-1.0.md",
]

[tool.mutmut]
# mutmut 3.x: narrow scope for manageable local/scheduled runs (full `python/cos` is huge).
paths_to_mutate = ["python/cos/sigma_gate.py"]
tests_dir = ["tests"]
pytest_add_cli_args = [
  "-q",
  "--tb=no",
  "tests/test_sigma_properties.py",
  "tests/test_gate.py",
  "tests/test_sigma_gate_core.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
  "slow: tests that sleep or do extra work on purpose",
  "integration: may require optional third-party packages (langchain-core, litellm, …)",
]

# pytest-cov defaults: branch coverage; 70% gate applies via Makefile / CI on σ-core modules
# (see `COS_COV_FLAGS`), not on the full `python/cos` lab tree.
[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__",
  "if TYPE_CHECKING",
  "raise NotImplementedError",
  "pass",
  "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

# python-semantic-release (PSR v10): Conventional Commits → pyproject version + CHANGELOG.md.
# CI: .github/workflows/pypi-semantic-release.yml (PyPI). Tag/binary releases: .github/workflows/release.yml.
[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
# Ensure PEP 517 backend deps exist in thin CI images (PSR Docker action).
build_command = "pip install --upgrade pip build hatchling && python -m build"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  '''chore(?:\([^)]*?\))?: .+''',
  '''ci(?:\([^)]*?\))?: .+''',
  '''style(?:\([^)]*?\))?: .+''',
  '''test(?:\([^)]*?\))?: .+''',
]

[tool.semantic_release.commit_parser_options]
# feat → minor; fix, perf → patch; docs/refactor/build → allowed but no bump (other_allowed_tags).
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "build"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["refactor", "docs", "build"]
