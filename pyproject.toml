#
# Canonical sdist/wheel for the `cos` Python package (`python/cos/`).
# The separate OpenAI-compat SDK lives under `sdk/python/` (see that tree's pyproject).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creation-os"
version = "1.0.0"
description = "σ-gate cognitive architecture for hallucination detection — zero-dependency core; optional probes, frameworks, and HTTP extras."
readme = "README.md"
license = "LicenseRef-SCSL-1.0 OR AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{ name = "Lauri Elias Rainio", email = "lauri@spektrelabs.com" }]
keywords = [
  "ai",
  "llm",
  "hallucination",
  "hallucination-detection",
  "sigma-gate",
  "sigma",
  "safety",
  "cognitive-architecture",
  "detection",
  "runtime",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: Other/Proprietary License",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: C",
  "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.136",
  "uvicorn>=0.32",
]
probes = [
  "numpy>=1.24",
  "torch>=2.0",
  "transformers>=4.40",
  "scikit-learn>=1.4",
]
# HTTP stack for local `cos serve` / ASGI surfaces (MCP remains optional transport).
serve = [
  "fastmcp>=3.0",
  "fastapi>=0.136",
  "uvicorn>=0.32",
  "websockets>=12.0",
  "httpx>=0.27",
  "openai>=1.30",
]
mcp = [
  "mcp>=1.27",
  "fastmcp>=3.0",
]
viz = ["networkx>=3.2", "matplotlib>=3.8"]
ui = ["nicegui>=2.0", "pywebview>=5.0"]
voice = [
  "faster-whisper>=1.0.0",
  "sounddevice>=0.4.6",
  "soundfile>=0.12.0",
  "kokoro>=0.9",
]
health = ["psutil>=5.9"]
eval = ["scikit-learn", "pandas"]
langchain = ["langchain-core>=0.2"]
openai = ["openai>=1.30"]
chat = ["openai>=1.30"]
litellm = ["litellm>=1.40"]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.55"]
autogen = ["autogen-agentchat>=0.4"]
frameworks = [
  "langchain-core>=0.2",
  "openai>=1.30",
  "litellm>=1.40",
  "langgraph>=0.2",
  "crewai>=0.55",
  "autogen-agentchat>=0.4",
]
dev = [
  "ruff>=0.4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "numpy>=1.24",
  "openai>=1.30",
  "fastmcp>=3.0",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "nicegui>=2.0",
]
# Expanded explicitly so `pip install "creation-os[all]"` works from sdist/wheel
# without self-referential extra cycles (PEP 508 optional deps).
all = [
  "fastmcp>=3.0",
  "fastapi>=0.136",
  "uvicorn>=0.32",
  "websockets>=12.0",
  "httpx>=0.27",
  "numpy>=1.24",
  "torch>=2.0",
  "transformers>=4.40",
  "scikit-learn>=1.4",
  "faster-whisper>=1.0.0",
  "sounddevice>=0.4.6",
  "soundfile>=0.12.0",
  "kokoro>=0.9",
  "langchain-core>=0.2",
  "openai>=1.30",
  "litellm>=1.40",
  "langgraph>=0.2",
  "crewai>=0.55",
  "autogen-agentchat>=0.4",
  "psutil>=5.9",
  "pandas",
  "ruff>=0.4",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "nicegui>=2.0",
  "pywebview>=5.0",
]

[project.scripts]
cos = "cos.cli:main"

[project.urls]
Homepage = "https://github.com/spektre-labs/creation-os"
Repository = "https://github.com/spektre-labs/creation-os"
Documentation = "https://github.com/spektre-labs/creation-os#readme"
Issues = "https://github.com/spektre-labs/creation-os/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/cos"]

[tool.hatch.build.targets.sdist]
include = [
  "/python/cos",
  "/examples",
  "/CHANGELOG.md",
  "/README.md",
  "/LICENSE",
  "/LICENSE-AGPL-3.0.txt",
  "/LICENSE-SCSL-1.0.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

# Mirrors pytest.ini so `pytest` picks up paths without a local pytest.ini (e.g. sdist).
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
  "slow: tests that sleep or do extra work on purpose",
  "integration: may require optional third-party packages (langchain-core, litellm, …)",
]
