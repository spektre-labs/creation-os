#
# One-click FastAPI σ-gate (Python package + ``cos serve``).
#
#   docker compose -f docker-compose.python-oneclick.yml up -d --build
#   curl -fsS http://127.0.0.1:8000/health
#   curl -fsS http://127.0.0.1:8000/v1/score \
#     -H 'Content-Type: application/json' \
#     -d '{"prompt":"2+2","response":"4"}'

services:
  sigma-gate:
    build:
      context: .
      dockerfile: Dockerfile.python-oneclick
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
