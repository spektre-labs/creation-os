[pytest]
testpaths = tests
pythonpath = python
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests (optional third-party packages)
    bench: marks benchmark tests
