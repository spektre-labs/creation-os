#
# Default container port 8000 matches ``Dockerfile.python-oneclick`` / ``cos serve``.
# GHCR FastAPI image (``*-fastapi``) listens on 8420 — set service.targetPort + health.port to 8420.
# GPU: ``helm install … --set gpu.enabled=true``
# KEDA queue-depth autoscaling: install KEDA separately; add a ScaledObject (custom metrics) alongside or instead of CPU HPA.

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: spektrelabs/creation-os
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

health:
  path: /health
  port: 8000

gpu:
  enabled: false
  count: 1
  type: "nvidia.com/gpu"

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

env:
  - name: COS_LOG_LEVEL
    value: "info"
